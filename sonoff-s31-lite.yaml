esphome:
  name: sonoff-s31-lite
  friendly_name: Sonoff S31 Lite
  project:
    name: "Sonoff.S31-Lite"
    version: "2025.12.0"

esp8266:
  board: esp01_1m
  framework:
    version: recommended
  restore_from_flash: true

api:
  reboot_timeout: 0s
    
ota:
  platform: esphome

wifi:
  ssid: "sonoff-s31"
  password: "12345678"
  min_auth_mode: WPA2
  ap:
    ssid: "sonoff-s31-setup"
    password: "12345678"

captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  ota: false
  auth:
    username: "admin"
    password: "12345678"

logger:
  baud_rate: 0
  logs:
    sensor: DEBUG

uart:
  rx_pin: RX
  baud_rate: 4800

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
    name: "Button"
    internal: true
    on_press:
      - switch.toggle: relay

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: "mdi:ip-network"
    mac_address:
      name: "MAC Address"
      icon: "mdi:network"
    ssid:
      name: "Connected SSID"
      icon: "mdi:wifi"
      
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    icon: "mdi:signal"
    update_interval: 60s

switch:
  - platform: gpio
    name: "S31 Switch"
    icon: "mdi:power-plug"
    pin: GPIO12
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: restart
    name: "Reboot"
    icon: "mdi:restart"

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Sofia
    servers:
     - pool.ntp.org
     - time.google.com
     - time.windows.com

status_led:
  pin:
    number: GPIO13